	.chat-item .icon-btn:hover { color: #fff; }

	.menu-btn { background: none; border: none; color: #e0e0e0; font-size: 22px; cursor: pointer; padding: 6px 10px; flex-shrink: 0; border-radius: 8px; }
	.top-bar-title { font-weight: 600; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	
	.top-btn {
		background: #252525; color: #fff; border: none; width: 38px; height: 38px; 
		border-radius: 10px; font-size: 18px; cursor: pointer; 
		display: flex; align-items: center; justify-content: center; 
		flex-shrink: 0; transition: background 0.2s;
	}
	.top-btn:hover { background: #333; }
	.top-new-chat { background: #2563eb; color: #fff; border: none; width: 38px; height: 38px; border-radius: 10px; font-size: 24px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; flex-shrink: 0; }
	.top-new-chat:hover { background: #1d4ed8; }

	.messages { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
	.message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; position: relative; }
	.message.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
	.message.bot { align-self: flex-start; background: #252525; color: #e0e0e0; border-bottom-left-radius: 4px; }

	.message img { max-width: 100%; border-radius: 12px; margin-bottom: 8px; display: block; }
	.message .file-attachment {
		display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2);
		padding: 8px 12px; border-radius: 10px; margin-bottom: 8px;
	}
	.message .file-attachment .file-icon { font-size: 24px; }
	.message .file-attachment .file-name { font-size: 13px; color: #fff; }

	.code-block { margin: 8px 0; border-radius: 10px; overflow: hidden; background: #0a0a0a; border: 1px solid #333; }
	.code-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 12px; color: #888; }
	.code-header .lang { font-family: monospace; text-transform: uppercase; font-weight: 600; }
	.copy-btn { background: #333; color: #e0e0e0; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; transition: background 0.2s; outline: none; }
	.copy-btn:hover { background: #444; }
	.copy-btn.copied { background: #16a34a; color: #fff; }
	.code-block pre { padding: 12px; overflow-x: auto; font-family: 'Courier New', Consolas, monospace; font-size: 13px; line-height: 1.4; color: #e0e0e0; white-space: pre; -webkit-overflow-scrolling: touch; }

	.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; color: #888; }

	.welcome p { font-size: 14px; max-width: 400px; }

	/* Поле ввода */
	.input-area { padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #2a2a2a; display: flex; gap: 8px; flex-shrink: 0; background: #0f0f0f; align-items: flex-end; }
	.attach-btn { background: #252525; border: 1px solid #2a2a2a; color: #888; font-size: 20px; width: 48px; height: 48px; border-radius: 12px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; }
	.attach-btn:hover { color: #fff; border-color: #2563eb; }
	.attach-btn.has-file { border-color: #16a34a; color: #16a34a; }
	.attach-btn.has-file::after {
		content: "✓"; position: absolute; top: -4px; right: -4px;
		background: #16a34a; color: #fff; font-size: 10px; width: 16px; height: 16px;
		border-radius: 50%; display: flex; align-items: center; justify-content: center;
	}
	
	.input-area textarea { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0e0e0; padding: 12px 16px; border-radius: 14px; font-family: inherit; font-size: 16px; resize: none; max-height: 120px; min-height: 48px; }
	.input-area textarea:focus { outline: none; border-color: #2563eb; }
	.send-btn { background: #2563eb; border: none; color: #fff; padding: 0 20px; height: 48px; border-radius: 14px; cursor: pointer; font-size: 18px; font-weight: 600; }
	.send-btn:hover { background: #1d4ed8; }
	.send-btn:disabled { background: #444; cursor: not-allowed; }

	/* Оверлей и модалки */
	.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
	.overlay.active { display: block; }
	.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
	.modal.active { display: flex; }
	.modal-content { background: #1a1a1a; border-radius: 14px; padding: 20px; width: 100%; max-width: 320px; border: 1px solid #2a2a2a; }
	.modal-content h3 { font-size: 16px; margin-bottom: 12px; color: #fff; }
	.modal-content input { width: 100%; background: #252525; border: 1px solid #2a2a2a; color: #e0e0e0; padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
	.modal-content input:focus { outline: none; border-color: #2563eb; }
	.modal-actions { display: flex; gap: 8px; }

	.modal-actions .cancel { background: #333; color: #e0e0e0; }
	.modal-actions .save { background: #2563eb; color: #fff; }

	/* Роли */
	.role-item {
		padding: 12px;
		margin-bottom: 6px;
		background: #252525;
		border-radius: 10px;
		cursor: pointer;
		font-size: 14px;
		display: flex;
		justify-content: space-between;
		align-items: center;
		transition: background 0.2s;
	}
	.role-item:hover { background: #333; }
	.role-item.active { background: #2563eb; }
	.role-list { max-height: 60vh; overflow-y: auto; padding-right: 4px; }

	@media (max-width: 768px) {
		.sidebar { position: absolute; height: 100%; z-index: 100; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
	}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="app" id="app">
	<div class="sidebar hidden" id="sidebar">
		<div class="sidebar-header">
			<h1>Чаты</h1>
			<button class="new-chat-btn" onclick="newChat()">+ Новый</button>

		<div class="chat-list" id="chatList"></div>
	</div>

	<div class="main">
		<div class="top-bar">

			<textarea id="input" placeholder="Введите сообщение..." rows="1"></textarea>
			<button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
		</div>
	</div>
</div>

<!-- Модалка переименования -->

		<h3>Название чата</h3>

		<div class="modal-actions">
			<button class="cancel" onclick="closeEditModal()">Отмена</button>
			<button class="save" onclick="saveTitle()">Сохранить</button>
		</div>
	</div>
</div>

<!-- Модалка выбора роли -->
<div class="modal" id="roleModal">
	<div class="modal-content">
		<h3>Настройка роли</h3>
		<div class="role-list" id="roleList"></div>
		<div class="modal-actions" style="margin-top: 12px;">
			<button class="cancel" onclick="closeRoleModal()">Закрыть</button>
		</div>
	</div>
</div>

// ===== КОПИРОВАНИЕ =====
async function copyToClipboard(text, btn) {
	let success = false;
	if (navigator.clipboard && window.isSecureContext) {
		try { await navigator.clipboard.writeText(text); success = true; } catch (e) {}
	}
	if (!success) {
		try {
			const ta = document.createElement("textarea");
			ta.value = text; ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0";
			ta.style.width = "2em"; ta.style.height = "2em"; ta.style.opacity = "0";
			document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
			success = document.execCommand("copy"); document.body.removeChild(ta);
		} catch (e) {}
	}
	if (success) {
		btn.textContent = "✅ Copied"; btn.classList.add("copied");
		setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1500);
	} else {
		btn.textContent = "❌ Error"; setTimeout(() => { btn.textContent = "Copy"; }, 1500);
	}
}

// ===== ПАРСЕР КОДА =====
function parseMessageContent(text) {
	const parts = []; const regex = /```(\w*)\n?([\s\S]*?)```/g;
	let lastIndex = 0; let match;
	while ((match = regex.exec(text)) !== null) {
		if (match.index > lastIndex) parts.push({ type: "text", content: text.substring(lastIndex, match.index) });
		parts.push({ type: "code", lang: match[1] || "code", content: match[2].trim() });
		lastIndex = regex.lastIndex;
	}
	if (lastIndex < text.length) parts.push({ type: "text", content: text.substring(lastIndex) });
	if (parts.length === 0) parts.push({ type: "text", content: text });
	return parts;
}

function createCodeBlock(part) {
	const codeBlock = document.createElement("div"); codeBlock.className = "code-block";
	const header = document.createElement("div"); header.className = "code-header";
	const lang = document.createElement("span"); lang.className = "lang"; lang.textContent = part.lang;
	const copyBtn = document.createElement("button"); copyBtn.className = "copy-btn"; copyBtn.textContent = "Copy";
	copyBtn.onclick = (e) => { e.stopPropagation(); copyToClipboard(part.content, copyBtn); };
	header.appendChild(lang); header.appendChild(copyBtn);
	const pre = document.createElement("pre"); const code = document.createElement("code");
	code.textContent = part.content; pre.appendChild(code);
	codeBlock.appendChild(header); codeBlock.appendChild(pre);
	return codeBlock;
}

function renderMessageContent(container, content, fileData = null) {
	if (fileData) {
		if (fileData.type === "image") {
			const img = document.createElement("img"); img.src = fileData.data; container.appendChild(img);
		} else {
			const fileDiv = document.createElement("div"); fileDiv.className = "file-attachment";
			fileDiv.innerHTML = `<span class="file-icon">📄</span><span class="file-name">${fileData.name}</span>`;
			container.appendChild(fileDiv);
		}
	}
	const parts = parseMessageContent(content);
	parts.forEach(part => {
	if (part.type === "text") {
		const span = document.createElement("span"); 
		span.innerHTML = part.content; // Изменено с textContent на innerHTML
		container.appendChild(span);
	} else { container.appendChild(createCodeBlock(part)); }
});
}

// ===== РЕНДЕР =====
function renderChatList() {
	const list = document.getElementById("chatList"); list.innerHTML = "";
	if (chats.length === 0) {
		list.innerHTML = '<p style="color:#555; text-align:center; padding:20px; font-size:13px;">Нет чатов</p>'; return;
	}
	chats.forEach(chat => {
		const div = document.createElement("div"); div.className = "chat-item" + (chat.id === currentChatId ? " active" : "");
		const titleSpan = document.createElement("span"); titleSpan.className = "title"; titleSpan.textContent = chat.title || "Новый чат";
		titleSpan.onclick = (e) => { e.stopPropagation(); openChat(chat.id); };
		const actions = document.createElement("div"); actions.className = "actions";
		const editBtn = document.createElement("button"); editBtn.className = "icon-btn"; editBtn.textContent = "✎";
		editBtn.onclick = (e) => { e.stopPropagation(); openEditModal(chat.id); };
		const delBtn = document.createElement("button"); delBtn.className = "icon-btn delete"; delBtn.textContent = "×";
		delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
		actions.appendChild(editBtn); actions.appendChild(delBtn);
		div.appendChild(titleSpan); div.appendChild(actions);
		div.onclick = () => openChat(chat.id);
		list.appendChild(div);
	});
}

function renderMessages() {
	const chat = getCurrentChat();
	const messagesDiv = document.getElementById("messages");
	const welcomeDiv = document.getElementById("welcome");
	const topTitle = document.getElementById("topTitle");

	if (!chat) {
		messagesDiv.style.display = "none"; welcomeDiv.style.display = "flex"; topTitle.textContent = "Новый чат"; return;
	}
	topTitle.textContent = chat.title || "Новый чат";
	if (chat.messages.length === 0) {
		messagesDiv.style.display = "none"; welcomeDiv.style.display = "flex"; return;
	}
	messagesDiv.style.display = "flex"; welcomeDiv.style.display = "none"; messagesDiv.innerHTML = "";
	chat.messages.forEach(msg => {
		const div = document.createElement("div");
		div.className = "message " + (msg.role === "assistant" ? "bot" : msg.role);
		renderMessageContent(div, msg.content, msg.file);
		messagesDiv.appendChild(div);
	});
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
document.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touchStartTime = Date.now(); }, { passive: true });
document.addEventListener("touchend", (e) => {
	const deltaX = e.changedTouches[0].clientX - touchStartX;
	const deltaY = e.changedTouches[0].clientY - touchStartY;
	const deltaTime = Date.now() - touchStartTime;
	if (deltaX > 80 && Math.abs(deltaY) < 80 && deltaTime < 500) {
		const sidebar = document.getElementById("sidebar");
		if (sidebar.classList.contains("hidden") && touchStartX < 50) { sidebar.classList.remove("hidden"); document.getElementById("overlay").classList.add("active"); }
	}
	if (deltaX < -80 && Math.abs(deltaY) < 80 && deltaTime < 500) {
		const sidebar = document.getElementById("sidebar"); if (!sidebar.classList.contains("hidden")) closeSidebar();
	}
}, { passive: true });

	const btn = document.getElementById("attachBtn");
	if (pendingFile) { btn.classList.add("has-file"); btn.textContent = "📎"; }
	else { btn.classList.remove("has-file"); btn.textContent = "📎"; }
}

function handleFileSelect(event) {
	const file = event.target.files[0];
	if (!file) return;
	if (file.size > 20 * 1024 * 1024) { alert("Файл слишком большой (макс. 20 МБ)."); return; }

	const reader = new FileReader();
	if (file.type.startsWith("image/")) {
		reader.onload = function(e) {
			const img = new Image();
			img.onload = function() {
				const canvas = document.createElement("canvas");
				const MAX_SIZE = 1024;
				let width = img.width; let height = img.height;
				if (width > height) {
					if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
				} else {
					if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
				}
				canvas.width = width; canvas.height = height;
				const ctx = canvas.getContext("2d");
				ctx.drawImage(img, 0, 0, width, height);
				pendingFile = { type: "image", data: canvas.toDataURL("image/jpeg", 0.7), name: file.name };
				updateAttachBtn();
			};
			img.src = e.target.result;
		};
		reader.readAsDataURL(file);
	} else {
		reader.onload = function(e) {
			pendingFile = { type: "text", data: e.target.result, name: file.name };
			updateAttachBtn();
		};
		reader.readAsText(file);
	}
	event.target.value = "";
}

// ===== ПЕЧАТЬ =====
async function typeWriterEffect(container, fullText) {
	container.innerHTML = "";
	const parts = parseMessageContent(fullText);
	for (let i = 0; i < parts.length; i++) {
		const part = parts[i];
		if (part.type === "text") {
			const textNode = document.createTextNode(""); container.appendChild(textNode);
			const chars = Array.from(part.content);
			for (let j = 0; j < chars.length; j++) {
				textNode.textContent += chars[j];
				document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
				await new Promise(r => setTimeout(r, 15));
			}
		} else if (part.type === "code") {
			container.appendChild(createCodeBlock(part));
			document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
		}
	}
}

// ===== ОТПРАВКА =====
async function sendMessage() {
	if (isTyping) return;
	const input = document.getElementById("input");
	const sendBtn = document.getElementById("sendBtn");
	const text = input.value.trim();
	
	if (!text && !pendingFile) return;

	if (!currentChatId) {
		const newChatObj = {
			id: generateId(),
			title: text.substring(0, 16) + (text.length > 16 ? "..." : "") || "Файл",
			messages: []
		};
		chats.unshift(newChatObj); currentChatId = newChatObj.id;
	}

	const chat = getCurrentChat();
	const userMsg = { role: "user", content: text || (pendingFile ? "Опиши этот файл." : "") };
	if (pendingFile) userMsg.file = pendingFile;
	chat.messages.push(userMsg);
	
	saveChats(); renderMessages(); renderChatList();

	const wasPhoto = pendingFile && pendingFile.type === "image";
	input.value = ""; input.style.height = "auto"; input.blur();
	pendingFile = null; updateAttachBtn();
	
	sendBtn.disabled = true; isTyping = true;

	const messagesDiv = document.getElementById("messages");
	messagesDiv.style.display = "flex"; document.getElementById("welcome").style.display = "none";

	const typingDiv = document.createElement("div"); typingDiv.className = "message bot";
	typingDiv.innerHTML = `<i>Формирую ответ...</i>`;
	messagesDiv.appendChild(typingDiv); messagesDiv.scrollTop = messagesDiv.scrollHeight;

	// Формируем системный промпт на основе выбранной роли
	let sysPrompt = ROLES[currentRole] || ROLES["помощник"];
	sysPrompt += " Всегда отвечай на русском языке.";

	const apiMessages = chat.messages.map((msg, index) => {
		if (msg.file && msg.file.type === "image" && index === chat.messages.length - 1) {
			return { role: "user", content: [{ type: "text", text: msg.content }, { type: "image_url", image_url: { url: msg.file.data } }] };
		}
		if (msg.file && msg.file.type === "text" && index === chat.messages.length - 1) {
			return { role: "user", content: `[Содержимое файла ${msg.file.name}]:\n\n${msg.file.data}\n\n[Запрос]: ${msg.content}` };
		}
		if (msg.file) { return { role: msg.role, content: `[Файл] ${msg.content}` }; }
		if (msg.role === "assistant") { return { role: "assistant", content: msg.content, reasoning_content: "" }; }
		return msg;
	});

	let modelsToTry = wasPhoto ? VISION_MODELS : [MODEL];
	let answer = null;
	let lastError = "Неизвестная ошибка";

	for (let m = 0; m < modelsToTry.length; m++) {
		const modelToUse = modelsToTry[m];
		try {
			const response = await fetch(API_URL, {
				method: "POST",
				headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
				body: JSON.stringify({
					model: modelToUse,
					messages: [{ role: "system", content: sysPrompt }, ...apiMessages],
					max_tokens: 1500,
					reasoning: { enabled: false }
				})
			});

			const data = await response.json();
			if (data.error) { lastError = data.error.message; continue; }
			if (!data.choices || !data.choices[0] || !data.choices[0].message) { lastError = "Пустой ответ"; continue; }
			
			answer = data.choices[0].message.content;
			break;
		} catch (e) { 
			lastError = e.message; 
			continue; 
		}
	}

	if (answer === null) {
		let displayError = "🔴 Не удалось получить ответ.\n(" + lastError + ")";
		if (lastError.includes("Failed to fetch") || lastError.includes("fetch")) {
			displayError = "🔴 Ошибка поиска сети. Пожалуйста, проверьте интернет-соединение и повторите попытку.";
		}
		typingDiv.textContent = displayError;
		chat.messages.push({ role: "assistant", content: displayError });
		saveChats();
	} else {
		chat.messages.push({ role: "assistant", content: answer });
		saveChats();
		typingDiv.innerHTML = "";
		await typeWriterEffect(typingDiv, answer);
	}

	sendBtn.disabled = false; isTyping = false; input.blur();
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ===== TEXTAREA =====
inputEl.addEventListener("input", function() {
	this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

inputEl.addEventListener("keydown", function(e) {
	if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeEditModal(); });

// ===== ЗАПУСК =====
renderChatList();
renderMessages();
</script>
